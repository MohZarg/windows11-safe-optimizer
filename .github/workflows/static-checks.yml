name: Static checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  repository-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        shell: pwsh
        run: |
          $required = @(
            "README.md", "README.fa.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md",
            "scripts/Windows11_Optimizer.ps1",
            "scripts/common/Invoke-SafeOptimizer.ps1",
            "scripts/Windows7/Start-Windows7.ps1",
            "scripts/Windows81/Start-Windows81.ps1",
            "scripts/Windows10/Start-Windows10.ps1",
            "scripts/Windows11/Start-Windows11.ps1",
            "Run_Windows7.bat", "Run_Windows81.bat", "Run_Windows10.bat", "Run_Windows11.bat"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ("Missing required files: " + ($missing -join ", ")) }
      - name: Validate OS launcher guards and shared safety boundaries
        shell: pwsh
        run: |
          $checks = @{
            "scripts/Windows7/Start-Windows7.ps1" = "Windows 7"
            "scripts/Windows81/Start-Windows81.ps1" = "Windows 8\\.1"
            "scripts/Windows10/Start-Windows10.ps1" = "Windows 10"
            "scripts/Windows11/Start-Windows11.ps1" = "Windows 11"
          }
          foreach ($path in $checks.Keys) {
            $source = Get-Content -Raw $path
            if (-not $source.Contains($checks[$path])) {
              throw "Expected OS guard not found in $path"
            }
            if ($source -notmatch 'Get-CimInstance Win32_OperatingSystem') {
              throw "OS detection missing in $path"
            }
          }
          $core = Get-Content -Raw "scripts/common/Invoke-SafeOptimizer.ps1"
          foreach ($forbidden in @('Set-ItemProperty','New-ItemProperty','Stop-Service','Set-Service','Disable-ScheduledTask')) {
            if ($core -match [regex]::Escape($forbidden)) { throw "Unexpected high-risk operation in shared core: $forbidden" }
          }
          if ($core -notmatch 'Ask-YesNo "Delete eligible old TEMP files\?"') { throw "TEMP deletion consent gate missing" }
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
      - name: Analyze all PowerShell scripts
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $files = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse
          $results = foreach ($file in $files) {
            Invoke-ScriptAnalyzer -Path $file.FullName -Severity Error,Warning
          }
          $results | Format-Table -AutoSize
          if ($results | Where-Object { $_.Severity -eq "Error" }) { Write-Error "PSScriptAnalyzer reported errors." }
